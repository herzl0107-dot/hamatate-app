<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>המטאטא | סטודיו חזרות</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      direction: rtl;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 18px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 40px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>המטאטא</h1>
    <h2>סטודיו חזרות | הרצל 107</h2>

    <p>התחברות למערכת הזמנת הסטודיו</p>

    <label for="email">מייל</label>
    <input
      type="email"
      id="email"
      placeholder="המייל שאיתו נרכשה הכרטיסייה"
    >

    <label for="password">סיסמה</label>
    <input
      type="password"
      id="password"
      placeholder="סיסמה"
    >

    <button type="button" id="loginButton">
  כניסה
</button>

    <p class="note">
      יש להתחבר באמצעות כתובת המייל המשויכת לכרטיסיית המטאטא.
    </p>

  </main><section id="dashboard" class="container" style="display: none;">
  <h1>המטאטא</h1>

  <h2 id="welcomeName">היי 👋</h2>

  <p>נותרו לך בכרטיסייה:</p>

  <div style="font-size: 48px; font-weight: bold; margin: 20px 0;">
    <span id="remainingHours">--</span> שעות
  </div>

<button type="button" id="openBookingButton">הזמנת הסטודיו</button>  <button type="button">ההזמנות שלי</button>
  <button type="button">היסטוריית שעות</button>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<section id="bookingScreen" class="container" style="display: none;">
  <h1>הזמנת הסטודיו</h1>

  <label for="bookingDate">תאריך</label>
<input type="date" id="bookingDate" required>
  <label for="startTime">שעת התחלה</label>
<input
  type="time"
  id="startTime"
  min="10:00"
  max="19:00"
  step="1800"
  required
>
  <label for="duration">משך ההזמנה</label>
  <select id="duration" style="width: 100%; box-sizing: border-box; padding: 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px;">
    <option value="1">שעה</option>
    <option value="1.5">שעה וחצי</option>
    <option value="2">שעתיים</option>
    <option value="2.5">שעתיים וחצי</option>
    <option value="3">3 שעות</option>
    <option value="3.5">3.5 שעות</option>
<option value="4">4 שעות</option>
<option value="4.5">4.5 שעות</option>
<option value="5">5 שעות</option>
  </select>

  <button type="button" id="confirmBookingButton">
    אישור הזמנה
  </button>

  <button type="button" id="backToDashboardButton">
    חזרה
  </button>

  <p class="note">
    ניתן להזמין עד 30 יום מראש. המינימום להזמנה הוא שעה.
  </p>
</section>
<script>
  const SUPABASE_URL = 'https://kfqfivyeeotvaoaatifz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YDTHDuKsJPAsjkgAnExxyg_wjr73ie0';

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );document.getElementById('loginButton').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    alert('יש להזין מייל וסיסמה');
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert('לא הצלחנו להתחבר. בדקי את המייל והסיסמה.');
    return;
  }

const user = data.user;

const { data: profile } = await supabaseClient
  .from('profiles')
  .select('*')
  .eq('id', user.id)
  .single();

const { data: balance, error: balanceError } = await supabaseClient
  .from('user_hour_balances')
  .select('remaining_hours')
  .eq('user_id', user.id)
  .single();

if (balanceError) {
  console.error(balanceError);
}

document.querySelector('main').style.display = 'none';
document.getElementById('dashboard').style.display = 'block';

if (profile && profile.full_name) {
  document.getElementById('welcomeName').textContent =
    'היי ' + profile.full_name + ' 👋';
}

document.getElementById('remainingHours').textContent =
  balance ? balance.remaining_hours : 0;
});document.getElementById('openBookingButton').addEventListener('click', () => {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('bookingScreen').style.display = 'block';
});

document.getElementById('backToDashboardButton').addEventListener('click', () => {
  document.getElementById('bookingScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
});

  document.getElementById('confirmBookingButton').addEventListener('click', async () => {
  const bookingDate = document.getElementById('bookingDate').value;
  const startTime = document.getElementById('startTime').value;
  const duration = parseFloat(document.getElementById('duration').value);

  if (!bookingDate || !startTime || !duration) {
    alert('יש למלא תאריך, שעת התחלה ומשך הזמנה');
    return;
  }

  const start = new Date(`${bookingDate}T${startTime}:00`);
  const end = new Date(start.getTime() + duration * 60 * 60 * 1000);

  const { data, error } = await supabaseClient.rpc('create_booking', {
    p_start: start.toISOString(),
    p_end: end.toISOString()
  });

  if (error) {
    console.error(error);

    const message = error.message || '';

    if (message.includes('NOT_ENOUGH_HOURS')) {
      alert('אין מספיק שעות בכרטיסייה להזמנה הזו');
    } else if (message.includes('TIME_NOT_AVAILABLE')) {
      alert('השעה שבחרת כבר תפוסה');
    } else if (message.includes('MAX_3_ACTIVE_BOOKINGS')) {
      alert('כבר יש לך 3 הזמנות פעילות');
    } else if (message.includes('MAX_30_DAYS_AHEAD')) {
      alert('אפשר להזמין עד 30 יום מראש');
    } else if (message.includes('BOOKING_MUST_BE_IN_FUTURE')) {
      alert('אי אפשר להזמין מועד שכבר עבר');
    } else if (message.includes('MINIMUM_ONE_HOUR')) {
      alert('המינימום להזמנה הוא שעה');
    } else {
      alert('לא הצלחנו לבצע את ההזמנה. נסי שוב.');
    }

    return;
  }

  alert('ההזמנה נשמרה בהצלחה!');

  const { data: updatedBalance } = await supabaseClient
    .from('user_hour_balances')
    .select('remaining_hours')
    .eq('user_id', (await supabaseClient.auth.getUser()).data.user.id)
    .single();

  if (updatedBalance) {
    document.getElementById('remainingHours').textContent =
      updatedBalance.remaining_hours;
  }

  document.getElementById('bookingScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
});
  const bookingDateInput = document.getElementById('bookingDate');

const today = new Date();
const maxDate = new Date();
maxDate.setDate(today.getDate() + 30);

const formatDateForInput = (date) => {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
};

bookingDateInput.min = formatDateForInput(today);
bookingDateInput.max = formatDateForInput(maxDate);
  bookingDateInput.addEventListener('change', () => {
  if (!bookingDateInput.value) return;

  const selectedDate = new Date(bookingDateInput.value + 'T12:00:00');
  const dayOfWeek = selectedDate.getDay();

  if (dayOfWeek === 5 || dayOfWeek === 6) {
    alert('סטודיו המטאטא פתוח להזמנות בימים ראשון עד חמישי בלבד');
    bookingDateInput.value = '';
  }
});
  const startTimeInput = document.getElementById('startTime');
const durationInput = document.getElementById('duration');

function updateLatestStartTime() {
  const duration = parseFloat(durationInput.value);

  const closingMinutes = 20 * 60;
  const latestStartMinutes = closingMinutes - (duration * 60);

  const hours = Math.floor(latestStartMinutes / 60);
  const minutes = latestStartMinutes % 60;

  startTimeInput.max =
    String(hours).padStart(2, '0') +
    ':' +
    String(minutes).padStart(2, '0');

  if (startTimeInput.value && startTimeInput.value > startTimeInput.max) {
    startTimeInput.value = '';
  }
}

durationInput.addEventListener('change', updateLatestStartTime);

updateLatestStartTime();
  startTimeInput.addEventListener('change', () => {
  if (!startTimeInput.value) return;

  const duration = parseFloat(durationInput.value);

  const [hour, minute] = startTimeInput.value.split(':').map(Number);
  const startMinutes = (hour * 60) + minute;
  const endMinutes = startMinutes + (duration * 60);

  if (endMinutes > 20 * 60) {
    alert('סטודיו המטאטא פתוח עד 20:00. יש לבחור שעת התחלה מוקדמת יותר או משך הזמנה קצר יותר.');
    startTimeInput.value = '';
  }
});
</script>
</body>

</html>
