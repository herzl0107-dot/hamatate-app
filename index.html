<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>המטאטא | סטודיו חזרות</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      direction: rtl;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 18px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 40px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .note {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>המטאטא</h1>
    <h2>סטודיו חזרות | הרצל 107</h2>

    <p>התחברות למערכת הזמנת הסטודיו</p>

    <label for="email">מייל</label>
    <input
      type="email"
      id="email"
      placeholder="המייל שאיתו נרכשה הכרטיסייה"
    >

    <label for="password">סיסמה</label>
    <input
      type="password"
      id="password"
      placeholder="סיסמה"
    >

    <button type="button" id="loginButton">
  כניסה
</button>

    <p class="note">
      יש להתחבר באמצעות כתובת המייל המשויכת לכרטיסיית המטאטא.
    </p>

  </main><section id="dashboard" class="container" style="display: none;">
  <h1>המטאטא</h1>

  <h2 id="welcomeName">היי 👋</h2>

  <p>נותרו לך בכרטיסייה:</p>

  <div style="font-size: 48px; font-weight: bold; margin: 20px 0;">
    <span id="remainingHours">--</span> שעות
  </div>

  <button type="button">הזמנת הסטודיו</button>
  <button type="button">ההזמנות שלי</button>
  <button type="button">היסטוריית שעות</button>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://kfqfivyeeotvaoaatifz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YDTHDuKsJPAsjkgAnExxyg_wjr73ie0';

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );document.getElementById('loginButton').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    alert('יש להזין מייל וסיסמה');
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert('לא הצלחנו להתחבר. בדקי את המייל והסיסמה.');
    return;
  }

const user = data.user;

const { data: profile } = await supabaseClient
  .from('profiles')
  .select('*')
  .eq('id', user.id)
  .single();

const { data: balance, error: balanceError } = await supabaseClient
  .from('user_hour_balances')
  .select('remaining_hours')
  .eq('user_id', user.id)
  .single();

if (balanceError) {
  console.error(balanceError);
}

document.querySelector('main').style.display = 'none';
document.getElementById('dashboard').style.display = 'block';

if (profile && profile.full_name) {
  document.getElementById('welcomeName').textContent =
    'היי ' + profile.full_name + ' 👋';
}

document.getElementById('remainingHours').textContent =
  balance ? balance.remaining_hours : 0;
});
</script>
</body>

</html>
